include-file = ~/.config/polybar/colors/rainbow-colors.ini
include-file = ~/.config/polybar/colors/xrdb-colors.ini

include-file = ~/.config/polybar/modules/backlight-module.ini
include-file = ~/.config/polybar/modules/battery-module.ini
include-file = ~/.config/polybar/modules/date-module.ini
include-file = ~/.config/polybar/modules/cpu-module.ini
include-file = ~/.config/polybar/modules/memory-module.ini
include-file = ~/.config/polybar/modules/xkeyboard-module.ini
include-file = ~/.config/polybar/modules/wlan-module.ini
include-file = ~/.config/polybar/modules/eth-module.ini
include-file = ~/.config/polybar/modules/pulseaudio-module.ini
include-file = ~/.config/polybar/modules/xworkspaces-module.ini
include-file = ~/.config/polybar/modules/xwindow-module.ini
include-file = ~/.config/polybar/modules/mpd-module.ini
include-file = ~/.config/polybar/modules/tray-module.ini
include-file = ~/.config/polybar/modules/powermenu-module.ini

[bar/test]
monitor = ${env:MONITOR:}
width = 100%
height = 18pt
radius = 0
bottom = true
line-size = 2pt
border-size = 4pt
border-color = #000000
module-margin = 1
modules-left = xworkspaces systray xwindow
modules-center = mpd
modules-right = pulseaudio wlan eth battery date powermenu
font-0 = FontAwesome:style=Regular:size=10
font-1 = Noto Sans Mono:style=Regular:size=10
wm-restack = bspwm
override-redirect = false
enable-ipc = false

[settings]
screenchange-reload = true

[global/wm]
margin-left = 1
margin-right = 1
